name: Test

on:
  pull_request:
  push:
    branches: [main]

# A superseded PR run owes nobody a verdict; pushes to main always finish.
concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - uses: ./.github/actions/install-root-deps
      - run: npm run typecheck
      - run: npm run typecheck:api
      - run: npm run typecheck:contract-tests
      - run: npm run typecheck:dom-tests

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - uses: ./.github/actions/install-root-deps
      - run: npm run lint
      - run: npm run lint:boundaries
      - run: npm run lint:panel-content-writes
      - run: npm run lint:safe-local-storage
      - run: npm run lint:api-contract
      - run: npm run lint:rate-limit-policies
      - run: npm run lint:premium-fetch
      - run: npm run lint:unicode
      - run: npm run lint:md
      - run: npm run entitlement:crosswalk:check

  # test:data shards by measured duration; the denominator in --shard must
  # match the matrix length.
  unit-shards:
    name: unit-shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Some suites read commit history (last-modified dates).
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - uses: ./.github/actions/install-root-deps
      - name: Install Redis for the Lua archive suites
        run: |
          sudo apt-get install -y --no-install-recommends redis-server redis-tools \
            || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends redis-server redis-tools; }
      - run: npm run test:data -- --shard=${{ matrix.shard }}/4 --concurrency=4

  dom-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - uses: ./.github/actions/install-root-deps
      - run: npm run test:dom

  convex-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - uses: ./.github/actions/install-root-deps
      - run: npm run test:convex

  sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - uses: ./.github/actions/install-root-deps
      - run: npm run test:sidecar

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - uses: ./.github/actions/install-root-deps
      - run: npx vite build

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - uses: ./.github/actions/install-root-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-results-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
